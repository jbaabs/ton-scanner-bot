<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRX Swap</title>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/tonweb/dist/tonweb.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:#fff; }
.container { padding:16px; }
.card { border:1px solid #1f2a37; border-radius:12px; padding:16px; margin-bottom:12px; }
.row { display:flex; justify-content:space-between; }
.small { font-size:12px; color:#aaa; }
.input { background:none; border:none; color:#fff; font-size:20px; width:60%; }
button { width:100%; padding:12px; border-radius:10px; border:none; background:#2b8cff; color:#fff; }
.percent-buttons { display:flex; gap:6px; margin-top:8px; }
.percent-buttons button { background:none; border:1px solid #333; font-size:12px; }
</style>
</head>

<body>

<div class="container">

<div class="card">
  <div class="small">You Pay</div>
  <div class="row">
    <input id="payAmount" class="input" value="1">
    <span>TON</span>
  </div>

  <div class="percent-buttons">
    <button onclick="setPercent(0.25)">25%</button>
    <button onclick="setPercent(0.5)">50%</button>
    <button onclick="setPercent(0.75)">75%</button>
    <button onclick="setMax()">MAX</button>
  </div>

  <div class="small" style="margin-top:6px;">
    Total: ~<span id="totalSend">1.3</span> TON
  </div>
</div>

<div class="card">
  <div class="small">You Receive (Estimated)</div>
  <div class="row">
    <span id="receiveAmount">...</span>
    <span>GRX</span>
  </div>
</div>

<button onclick="doSwap()">Swap</button>

<div id="status" class="small" style="text-align:center;margin-top:10px;">
Ready
</div>

</div>

<script>
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: 'https://your-domain.com/tonconnect-manifest.json'
});

// ⚠️ YOU MUST SET THIS
const DEDUST_VAULT = "EQBwf73XE22AFvGVQeaeh1tWLvKBAW_bolMpM_z2X6wqB-M3";

// ⚠️ YOU MUST SET THIS
const GRX_JETTON = "EQA6oZqfngpjbXn7SJdBjIYEoOxt_NusP4ULYCVAuQyG65G3";

let lastQuote = null;

// ---------- QUOTE ----------
async function fetchQuote() {
  const amount = parseFloat(document.getElementById('payAmount').value);
  if (!amount || amount <= 0) return;

  try {
    const nano = Math.floor(amount * 1e9);

    const res = await fetch(`https://api.dedust.io/v2/router/quote?amount=${nano}&from=ton&to=${GRX_JETTON}`);
    const data = await res.json();

    if (!data || !data.amountOut) return;

    lastQuote = data;

    const receive = (data.amountOut / 1e9).toLocaleString();
    document.getElementById('receiveAmount').innerText = receive;

  } catch (e) {
    console.error(e);
  }
}

// ---------- SWAP ----------
async function doSwap() {
  const amt = document.getElementById('payAmount').value;

  if (!amt || parseFloat(amt) <= 0) {
    return setStatus("Enter amount");
  }

  if (!tonConnectUI.connected) {
    await tonConnectUI.openModal();
    return;
  }

  if (!lastQuote) {
    return setStatus("Waiting for quote...");
  }

  try {
    setStatus("Preparing swap...");

    const userAmount = parseFloat(amt);

    const EXECUTION_BUFFER = 0.3;
    const total = userAmount + EXECUTION_BUFFER;

    const minReceive = Math.floor(lastQuote.amountOut * 0.9); // 10% slippage

    const payload = await buildPayload(minReceive);

    setStatus("Opening wallet...");

    await tonConnectUI.sendTransaction({
      validUntil: Math.floor(Date.now() / 1000) + 60,
      messages: [
        {
          address: DEDUST_VAULT,
          amount: TonWeb.utils.toNano(total.toString()),
          payload: payload
        }
      ]
    });

    setStatus("Swap sent");

  } catch (e) {
    console.error(e);
    setStatus("Transaction cancelled");
  }
}

// ---------- PAYLOAD ----------
async function buildPayload(minReceive) {
  const cell = new TonWeb.boc.Cell();

  cell.bits.writeUint(0x5fcc3d14, 32); // DeDust swap
  cell.bits.writeUint(0, 64);
  cell.bits.writeCoins(minReceive);

  const addr = new TonWeb.utils.Address(tonConnectUI.account.address);
  cell.bits.writeAddress(addr);

  return TonWeb.utils.bytesToBase64(await cell.toBoc());
}

// ---------- UI HELPERS ----------
function setStatus(msg) {
  document.getElementById('status').innerText = msg;
}

function updateTotal() {
  const val = parseFloat(document.getElementById('payAmount').value || 0);
  document.getElementById('totalSend').innerText = (val + 0.3).toFixed(3);
}

function setPercent(p) {
  const bal = 3.0; // replace with real
  document.getElementById('payAmount').value = (bal * p).toFixed(2);
  updateTotal();
  fetchQuote();
}

function setMax() {
  const bal = 3.0;
  document.getElementById('payAmount').value = bal;
  updateTotal();
  fetchQuote();
}

document.getElementById('payAmount').addEventListener('input', () => {
  updateTotal();
  fetchQuote();
});

updateTotal();
fetchQuote();
</script>

</body>
</html>
