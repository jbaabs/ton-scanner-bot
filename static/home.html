<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRX Swap</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
}

.container {
  padding: 16px;
}

.card {
  border: 1px solid #1f2a37;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.small {
  font-size: 12px;
  color: #aaa;
}

.input {
  background: transparent;
  border: none;
  color: white;
  font-size: 20px;
  width: 60%;
}

button {
  border-radius: 10px;
  padding: 10px;
  border: none;
  background: #2b8cff;
  color: white;
  font-weight: bold;
  width: 100%;
}

.percent-buttons {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.percent-buttons button {
  flex: 1;
  background: transparent;
  border: 1px solid #333;
  font-size: 12px;
}

.signal {
  padding: 4px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: rgba(0,255,100,0.15);
}

.signal.warn {
  background: rgba(255,200,0,0.15);
}

.center {
  text-align: center;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Chart -->
  <div class="card center">
    Chart Placeholder
  </div>

  <!-- Signals -->
  <div class="row">
    <div class="signal">🔒 Locked</div>
    <div class="signal">🟢 Buy Pressure</div>
    <div class="signal warn">⚠ Risk</div>
  </div>

  <!-- Wallet -->
  <div class="card">
    <div class="row small">
      <span>🟢 Connected: Tonkeeper</span>
      <span style="color:red;">Disconnect</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <span>GRAM: 3.231</span>
      <span>GRX: 2,519,849</span>
    </div>
  </div>

  <!-- Swap -->
  <div class="card">

    <!-- Pay -->
    <div>
      <div class="small">You Pay</div>
      <div class="row">
        <input class="input" value="1" />
        <span>GRAM</span>
      </div>

      <div class="percent-buttons">
        <button>25%</button>
        <button>50%</button>
        <button>75%</button>
        <button>MAX</button>
      </div>
    </div>

    <!-- Arrow -->
    <div class="center">↓</div>

    <!-- Receive -->
    <div>
      <div class="small">You Receive</div>
      <div class="row">
        <span style="font-size:20px;">2,519,000</span>
        <span>GRX</span>
      </div>
    </div>

    <!-- Info -->
    <div class="small" style="margin-top:10px;">
      <div class="row">
        <span>Price Impact</span>
        <span>1.8%</span>
      </div>
      <div class="row">
        <span>Slippage</span>
        <span>3%</span>
      </div>
    </div>

    <!-- Button -->
    <button id="swapBtn">Swap</button>

    <!-- Status -->
    <div id="status" class="small" style="text-align:center; margin-top:10px;">
      Ready
    </div>

  </div>

</div>

<script>
document.getElementById('swapBtn').onclick = () => {
  const status = document.getElementById('status');
  status.innerText = 'Opening wallet...';

  setTimeout(() => {
    status.innerText = 'Transaction cancelled in wallet';
  }, 2000);
};
</script>

</body>
</html>
