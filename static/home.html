<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRX Scanner // Home</title>
<script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"></script>
<style>
  :root{
    --void:#05070a;
    --panel:#0a1017;
    --panel-edge:#152233;
    --blue:#2ea6ff;
    --blue-deep:#0d6dc4;
    --blue-glow:#9fd8ff;
    --text:#e7f0f7;
    --muted:#5f7488;
    --red:#ff4d4d;
    --green:#3ee67f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100dvh;
    width:100%;
    background:var(--void);
    font-family:Arial,sans-serif;
    color:var(--text);
    overflow:hidden;
    position:fixed;
    inset:0;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100%;
    max-width:460px;
    margin:0 auto;
  }
  .ticker{
    overflow:hidden;
    white-space:nowrap;
    background:#000;
    border-bottom:1px solid var(--panel-edge);
    padding:6px 0;
    flex-shrink:0;
  }
  .ticker-inner{
    display:inline-block;
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:0.05em;
    color:var(--blue);
    animation:scroll 14s linear infinite;
  }
  .ticker-inner span.up{color:var(--green);}
  .ticker-inner span.down{color:var(--red);}
  @keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  .content{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px;
    -webkit-overflow-scrolling:touch;
  }

  .brand-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .brand{
    font-size:20px;
    font-weight:800;
    font-style:italic;
    letter-spacing:0.01em;
  }
  .brand em{ color:var(--blue); font-style:italic; }
  .brand small{
    display:block;
    font-size:9px;
    letter-spacing:0.18em;
    color:var(--muted);
    font-weight:400;
    font-style:normal;
    margin-top:2px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-1px;left:14px;right:14px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity:.7;
  }

  .price-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .price-label{
    font-size:10px;
    letter-spacing:0.15em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .price-val{
    font-size:32px;
    font-weight:800;
    color:var(--blue-glow);
    margin-top:4px;
  }
  .price-change{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    margin-top:2px;
  }
  .price-change.up{ color:var(--green); background:rgba(62,230,127,0.1); }
  .price-change.down{ color:var(--red); background:rgba(255,77,77,0.1); }

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:16px;
  }
  .stat-box{
    background:#060a10;
    border:1px solid var(--panel-edge);
    border-radius:6px;
    padding:10px 8px;
    text-align:center;
  }
  .stat-box .label{
    font-size:8px;
    letter-spacing:0.1em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .stat-box .val{
    font-size:14px;
    font-weight:800;
    color:var(--text);
    margin-top:4px;
  }

  .swap-card{ padding:0; overflow:hidden; }
  .swap-row{
    padding:14px 16px;
    border-bottom:1px solid var(--panel-edge);
  }
  .swap-row:last-child{ border-bottom:none; }
  .swap-label{
    font-size:9px;
    letter-spacing:0.15em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .swap-input-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .swap-amount{
    font-size:22px;
    font-weight:700;
    color:var(--muted);
  }
  .token-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:#060a10;
    border:1px solid var(--panel-edge);
    border-radius:20px;
    padding:6px 12px;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
  }
  .token-pill .dot{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--blue);
    flex-shrink:0;
  }

  .connect-btn{
    width:100%;
    background:linear-gradient(90deg, var(--blue), var(--blue-deep));
    color:#00131f;
    border:none;
    padding:14px;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-radius:8px;
    cursor:pointer;
    font-style:italic;
    margin-top:4px;
  }
  .connect-btn:active{ opacity:0.85; }
  .connect-btn.disabled{
    background:var(--panel-edge);
    color:var(--muted);
    cursor:not-allowed;
  }

  .note{
    font-size:10px;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
    line-height:1.5;
  }

  .loading, .error-state{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:30px 0;
  }
  .error-state{ color:var(--red); }

  .tabbar{
    display:flex;
    border-top:1px solid var(--panel-edge);
    background:var(--panel);
    flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:10px 0 8px;
    color:var(--muted);
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
  }
  .tab.active{ color:var(--blue-glow); }
  .tab .icon{ font-size:18px; line-height:1; }
</style>
</head>
<body>
<div id="app">

  <div class="ticker">
    <div class="ticker-inner" id="tickerText"></div>
  </div>

  <div class="content">
    <div class="brand-row">
      <div class="brand"><em>GRAMX</em>6900<small>FINANCIAL RESISTANCE</small></div>
    </div>

    <div id="statsArea">
      <div class="loading">Loading GRAM stats…</div>
    </div>

    <div class="card swap-card">
      <div class="swap-row">
        <div class="swap-label">You Pay</div>
        <div class="swap-input-row">
          <div class="swap-amount">0.0</div>
          <div class="token-pill"><span class="dot"></span>TON</div>
        </div>
      </div>
      <div class="swap-row">
        <div class="swap-label">You Receive · Estimated</div>
        <div class="swap-input-row">
          <div class="swap-amount">0.0</div>
          <div class="token-pill"><span class="dot"></span>GRAM</div>
        </div>
      </div>
    </div>

    <button class="connect-btn disabled" disabled>Connect Wallet</button>
    <div class="note">Wallet connect + live swap coming soon.<br>Stats above are live from the scanner.</div>
  </div>

  <div class="tabbar">
    <div class="tab active">
      <div class="icon">⌂</div>
      <div>Home</div>
    </div>
    <a class="tab" href="/games/snake">
      <div class="icon">🎮</div>
      <div>Games</div>
    </a>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
  } catch (err) {
    console.warn('Telegram WebApp init partial failure:', err);
  }
}

const tickerItems = [
  ['GRAMX6900', 'LIVE', 'up'],
  ['FINANCIAL RESISTANCE', '▲', 'up'],
  ['PERMISSIONLESS', '∞', 'up'],
];
function buildTicker(){
  const one = tickerItems.map(([label,val,dir]) => `${label} <span class="${dir}">${val}</span>`).join(' &nbsp;|&nbsp; ');
  document.getElementById('tickerText').innerHTML = one + ' &nbsp;|&nbsp; ' + one;
}
buildTicker();

function fmtUsd(n){
  if (n === null || n === undefined) return '—';
  if (n < 0.01) return '$' + n.toFixed(8).replace(/0+$/, '');
  return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 4 });
}
function fmtCompact(n){
  if (n === null || n === undefined) return '—';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}

async function loadStats(){
  const area = document.getElementById('statsArea');
  try {
    const res = await fetch('/api/gram/stats');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'unknown');

    const change = data.price_change_24h;
    const changeClass = (change || 0) >= 0 ? 'up' : 'down';
    const changeSign = (change || 0) >= 0 ? '▲' : '▼';

    area.innerHTML = `
      <div class="card">
        <div class="price-row">
          <div>
            <div class="price-label">${data.symbol} Price</div>
            <div class="price-val">${fmtUsd(data.price_usd)}</div>
          </div>
          ${change !== null && change !== undefined ? `<div class="price-change ${changeClass}">${changeSign} ${Math.abs(change).toFixed(2)}%</div>` : ''}
        </div>
        <div class="stats-grid">
          <div class="stat-box"><div class="label">Mkt Cap</div><div class="val">${fmtCompact(data.market_cap)}</div></div>
          <div class="stat-box"><div class="label">24h Vol</div><div class="val">${fmtCompact(data.volume_24h)}</div></div>
          <div class="stat-box"><div class="label">Holders</div><div class="val">${data.holders ?? '—'}</div></div>
        </div>
      </div>
    `;
  } catch (err) {
    area.innerHTML = `<div class="error-state">Couldn't load live stats. Pull to refresh.</div>`;
    console.warn('GRAM stats load failed:', err);
  }
}

loadStats();
setInterval(loadStats, 20000); // keep it fresh without hammering the endpoint
</script>
</body>
</html>
